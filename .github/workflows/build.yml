name: Build Vortex Ultra APK & AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-workflow:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate GitHub Workflows
        uses: rhysd/actionlint@v1

  build:
    runs-on: ubuntu-22.04
    needs: validate-workflow

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo apt-get clean

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libbz2-dev
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.5.0 cython==0.29.33 kivy==2.3.0

      - name: Build APK and AAB
        run: |
          unset ANDROID_HOME
          unset ANDROID_NDK_HOME
          # Zuerst das APK bauen
          yes | buildozer -v android debug
          # Dann das AAB bauen (Der korrekte Befehl!)
          yes | buildozer -v android aab debug
        env:
          BUILDOZER_ALLOW_ORG_NAME_START: 1
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Upload All Installers
        uses: actions/upload-artifact@v4
        with:
          name: Vortex-Ultra-Builds
          path: bin/
